[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kwola"
version = "0.1.52"
description = "AI powered software testing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright==1.62.0",
  "torch==2.7.0+cu126 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.22.0+cu126 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.7.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "torchvision==0.22.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "mitmproxy==11.0.2", "numpy==2.2.3", "opencv-python==4.11.0.86", "matplotlib==3.10.1",
  "pandas==2.2.3", "psutil==7.0.0", "requests==2.32.3",
  "scikit-image==0.25.2", "scikit-learn==1.6.1", "scipy==1.15.2", "testtools==2.7.2",
  "filetype==1.2.0", "billiard==4.2.1", "StringDist==1.0.9", "beautifulsoup4==4.13.3",
  "Faker==36.1.1", "giturlparse==0.12.0", "edlib==1.3.9.post1",
  "lmdb>=1.6,<2", "msgpack>=1.1,<2", "pydantic>=2.11,<3", "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.8,<8",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
kwola = "kwola.bin.main:main"

[tool.setuptools.packages.find]
include = ["kwola*"]

[tool.setuptools.package-data]
kwola = ["browser/assets/*.js", "instrumentation/assets/*.cjs", "images/*.png"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=kwola --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kwola"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP", "RUF"]
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kwola"]
exclude = ["^kwola/(components|datamodels|diagnostics|tasks)/"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
