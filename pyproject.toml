[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kwola"
version = "1.1.0"
description = "AI powered software testing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright==1.62.0",
  "torch==2.13.0",
  "mitmproxy==12.2.3", "numpy==2.5.2", "opencv-python==5.0.0.93", "matplotlib==3.11.1",
  "lmdb==1.8.1", "msgpack==1.1.2", "pydantic==2.11.10", "zstandard==0.25.0",
]

[dependency-groups]
dev = [
  "coverage[toml]==7.16.0",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.5",
]

[project.scripts]
kwola = "kwola.bin.main:main"

[tool.setuptools.packages.find]
include = ["kwola*"]

[tool.setuptools.package-data]
kwola = ["browser/assets/*.js", "instrumentation/assets/*.cjs", "images/*.png"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=kwola --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kwola"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP", "RUF"]
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kwola"]
