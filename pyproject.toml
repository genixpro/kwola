[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kwola"
version = "1.0.0"
description = "AI powered software testing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright==1.62.0",
  "torch==2.7.0+cu126 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.7.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "mitmproxy==11.0.2", "numpy==2.2.3", "opencv-python==4.11.0.86", "matplotlib==3.10.1",
  "lmdb>=1.6,<2", "msgpack>=1.1,<2", "pydantic>=2.11,<3", "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.8,<8",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
kwola = "kwola.bin.main:main"

[tool.setuptools.packages.find]
include = ["kwola*"]

[tool.setuptools.package-data]
kwola = ["browser/assets/*.js", "instrumentation/assets/*.cjs", "images/*.png"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=kwola --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kwola"]
omit = [
  "kwola/bin/*",
  "kwola/browser/adapter.py",
  "kwola/browser/autologin.py",
  "kwola/browser/executor.py",
  "kwola/browser/network.py",
  "kwola/browser/screenshots.py",
  "kwola/browser/session.py",
  "kwola/domain/protocols.py",
  "kwola/instrumentation/addon.py",
  "kwola/instrumentation/certificates.py",
  "kwola/instrumentation/proxy.py",
  "kwola/orchestration/doctor.py",
  "kwola/orchestration/experiment.py",
  "kwola/orchestration/results.py",
  "kwola/orchestration/testing.py",
  "kwola/orchestration/training.py",
  "kwola/reporting/*",
  "kwola/training/benchmark.py",
  "kwola/training/ddp.py",
  "kwola/training/distributed.py",
  "kwola/training/distributed_diagnostic.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP", "RUF"]
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kwola"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
