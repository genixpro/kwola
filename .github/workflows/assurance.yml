name: assurance

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        run: python -m pip install uv==0.9.24
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci
          uv run playwright install --with-deps chromium firefox
      - name: Static assurance
        run: |
          uv run ruff format --check kwola tests scripts
          uv run ruff check kwola tests scripts
          uv run mypy --strict kwola
      - name: Complete test suite
        run: uv run pytest
      - name: Dependency audits
        run: |
          uv run pip-audit --format json --output pip-audit.json || test -s pip-audit.json
          npm audit --json > npm-audit.json || test -s npm-audit.json
          uv run python scripts/audit_dependencies.py \
            --python-json pip-audit.json \
            --npm-json npm-audit.json \
            --exceptions security/advisory-exceptions.json
      - name: Build and smoke-install distributions
        run: |
          uv build
          python -m venv /tmp/kwola-wheel-smoke
          /tmp/kwola-wheel-smoke/bin/pip install dist/*.whl
          /tmp/kwola-wheel-smoke/bin/kwola --help
          python -m venv /tmp/kwola-sdist-smoke
          /tmp/kwola-sdist-smoke/bin/pip install dist/*.tar.gz
          /tmp/kwola-sdist-smoke/bin/kwola --help
